# stations 3：三站斜距三角定位。基站坐标和斜距来自 MQTT，配置里还需要 height_select。
# stations 2：双站斜距加已知高度。基站坐标、斜距和高度来自 MQTT，配置里还需要 side_select。
# height_select：higher、lower，或 "selected the higher solution"、"selected the lower solution"。
# side_select：left、right。left 是水平面内沿 A→B 的左侧。

stations 3

height_select lower

# 误差单位米。极限法当作界限，协方差法当作 1σ。
# 斜距误差对各条斜距相同；基站误差对各站的对应坐标分量相同。
# 这两项仍由本配置给出，不读取报文里的 sigma_r 和 type_a_site_sigma。
slant_range_error 0.15
base_error_x 0.05
base_error_y 0.05
base_error_z 0.05

# 仅 stations 2 读取。left 是水平面内沿 A→B 的左侧。高度来自 MQTT 发射信标的 z。
side_select left
